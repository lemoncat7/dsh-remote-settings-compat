# name in a DSH patch is an identity guard, NOT a module replacement.
# Keep the official Connection and supply its exact deployment authorities.
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  disabled: false
  inject: [webStartup, remoteSettingsTrust]
  config:
    trustedHosts: !!js "[...new Set([...ctx.webStartup.trustedHosts, ...ctx.remoteSettingsTrust.authorities])]"

- id: ui-settings
  # Keep the official settings namespace used by developerTools.setEnabled().
  disabled: false
  inject:
    - remoteSettingsTrust

- insert:
    - id: remote-settings-compat
      name: '@lemoncat7/dsh-remote-settings-compat'
      config:
        trustedOrigins: []

    - id: remote-access-gate
      name: '@lemoncat7/dsh-remote-settings-compat/access'
      config:
        enabled: false
        listenHost: 127.0.0.1
        listenPort: 3081
        secureCookies: true
        # Legacy fallback only. The authoritative list is
        # remote-settings-compat.trustedOrigins above.
        publicOrigins: []
        trustedProxyAddresses: []
        machineBearerPrefixes:
          - /knowledge-api/v1
        allowAnonymousKnowledgeShares: false
        sessionTtlMinutes: 720
        idleTimeoutMinutes: 60
        maxFailedAttempts: 5
        lockoutMinutes: 15
        bindSessionToIp: false
