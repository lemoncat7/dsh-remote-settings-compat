# DSH 0.1.2 authenticates every browser RPC and keeps remote settings in memory
# by default. Recreate its official Connection with the deployment authorities,
# then classify only explicitly trusted browser origins before ui-settings boots.
- id: connection
  disabled: true

- id: ui-settings
  # Keep the official settings namespace used by developerTools.setEnabled().
  disabled: false
  inject:
    - remoteSettingsTrust

- insert:
    - id: remote-settings-compat
      name: '@lemoncat7/dsh-remote-settings-compat'
      config:
        trustedOrigins: []

    - id: connection-after-remote-compat
      name: '@lemoncat7/dsh-remote-settings-compat/connection'

    - id: remote-access-gate
      name: '@lemoncat7/dsh-remote-settings-compat/access'
      config:
        enabled: false
        listenHost: 127.0.0.1
        listenPort: 3081
        secureCookies: true
        # Legacy fallback only. The authoritative list is
        # remote-settings-compat.trustedOrigins above.
        publicOrigins: []
        trustedProxyAddresses: []
        machineBearerPrefixes:
          - /knowledge-api/v1
        allowAnonymousKnowledgeShares: false
        sessionTtlMinutes: 720
        idleTimeoutMinutes: 60
        maxFailedAttempts: 5
        lockoutMinutes: 15
        bindSessionToIp: false
